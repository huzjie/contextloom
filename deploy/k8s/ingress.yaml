apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contextloom
  namespace: contextloom
spec:
  rules:
    - host: contextloom.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: contextloom
                port:
                  number: 80
